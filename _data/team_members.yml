- name: Le Chang
  photo: Chang_Le_02.jpg
  info: >
    Le is a PhD student who joined our group in Spring 2026. His interests lie in soil physics and biophysics,
    with a focus on the connections among plant roots, soil structure, water dynamics, and carbon cycling.
    He is particularly interested in how these interactions influence soil function and support sustainable agriculture.
    He is developing field and laboratory studies to examine how roots and organic matter shape soil structure and influence water storage,
    water movement, and carbon mineralization in agroforestry systems.
  # email: Bastiaans@Physics.LeidenUniv.nl
  number_educ: 1
  education1: MSc, Northwest A&F University, China
#
- name: Sloan Sink
  photo: Sink_Sloan.jpg
  info: >
    Sloan is a Master student who officially joined our group in Fall 2026.
    Sloan is studying whether fungal inoculation changes soil structure and hydrological properties in soils of the tropics.
    His work aims to translates into an understanding of erosion, runoff, and sedimentation patterns within different soil orders.
    Given recent weather events, his research has applications in tropical hazard-prevention models.
# email: Bastiaans@Physics.LeidenUniv.nl
  number_educ: 2
  education1: BA, University of Hawaiʻi at Mānoa
  education2: Certificate of Restoration of Natural Systems, University of Victoria
