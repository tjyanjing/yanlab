- name: Sarabella Stusen
  photo: Stusen.JPG
  info: >
    Sarabella is an undergraduate student in Global Environmental Science who joined our group in Spring 2025.
    She is currently working on her Undergraduate Research Thesis Project,
    which focuses on metadata analysis of soil hydraulic properties of soils on Oʻahu, Hawaiʻi.
    She is also contributing to our collaborative study developing AI toolsets to facilitate the analysis of legacy datasets from existing literature.
    Her project is supported by the University’s Undergraduate Research and Opportunities Program.
