- name: Sarabella Stusen
  photo: Stusen.JPG
  info: >
    Sarabella's is an undergraduate student at GES (Global Environmental Science), joining us in Spring 2025.
    Her project is about Metadata Analysis of Soil Hydraulic Properties of Soils on Oʻahu, Hawaiʻi.
    She is also contributing to our current collaborative study that develops AI toolsets to facilitate analysis of legacy datasets from existing literature.
    Her work is funded by the Undergraduate Research and Opportunities Program at the University.
    Sarabella plans to graduate in Spring 2027, her project directly serves as part of her undergraduate research thesis.
    She believes her thesis research can make a meaningful impact on soil health and sustainability!
