- name: Le Chang
  photo: Chang_Le.jpg
  info: >
    Le is a PhD student, joining us in Spring 2026. His interests lie in soil physics and biophysics, with a focus on the connections among plant roots, soil structure, water dynamics, and carbon cycling.
    He is particulalry interested in how these interactions influence soil function and support sustainable agriculture.
    Currently, he is developing field and laboratory studies to examine how plant roots and organic matter contribute to soil structure and how this relates to water storage, water movement, and carbon mineralization in agroforestry systems. I want to combines soil sampling, soil moisture monitoring, and measurements of soil hydraulic properties. Through this research, I aim to better understand the links between soil physical conditions and biological processes, providing insights for soil and water management.
  # email: Bastiaans@Physics.LeidenUniv.nl
  number_educ: 1
  education1: MSc, Northwest A&F University, China
